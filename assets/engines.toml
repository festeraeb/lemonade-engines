# Engine catalogue for lemonade-engines.
#
# Each engine runs as its own OpenAI-compatible server on 127.0.0.1 and is registered with the
# user's Lemonade as a provider (`lemonade cloud install <id> --base-url http://127.0.0.1:<port>/v1`),
# so its models appear in Lemonade as `<id>.<model>`. Lemonade itself is not modified.
#
# mode = "managed": lemonade-engines installs the files and starts the server.
# mode = "attach":  the server already runs at `url`; lemonade-engines only registers it.
#
# Placeholders in args: {port}, {dir} (this engine's install folder).
# Sources: https://... (downloaded; sha256 checked when given) or file:///... (copied; a folder is copied whole).
# A source ending in .tar.gz is unpacked into the install folder.

[[engine]]
id = "burn"
name = "lemonade-burn"
summary = "Microsoft BitNet b1.58 2B4T with a packed 2-bit ternary kernel. Runs on the CPU; no GPU needed."
licence = "MIT OR Apache-2.0 (BitNet weights: MIT)"
hardware = "Linux x86-64 (glibc 2.30 or newer), Windows x86-64 or macOS (Intel or Apple silicon); about 2 GB RAM; 0.9 GB download. Fastest on x86-64 with AVX2 or AVX-512; Apple silicon uses the plain kernel."
mode = "managed"
port = 13431
test_model = "bitnet-b1.58-2B-4T"
args = ["--host", "127.0.0.1", "--port", "{port}", "--model", "{dir}/bitnet-b1.58-2B-4T-lbt", "--model-id", "bitnet-b1.58-2B-4T"]
exe = "lemonade-burn-server"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.1/lemonade-burn-server-0.1.1-x86_64-linux.tar.gz"
dest = "lemonade-burn-server-0.1.1-x86_64-linux.tar.gz"
sha256 = "3b97e6b573716bb312a2cb601fa6cb35543384f2c11c234c826dc9fda05b7145"
platform = "x86_64-linux"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.1/lemonade-burn-server-0.1.1-x86_64-windows.tar.gz"
dest = "lemonade-burn-server-0.1.1-x86_64-windows.tar.gz"
sha256 = "d3ead93d40b42bc00096b71d54d9a24d3d169ffcc04a663cec286115696189ed"
platform = "x86_64-windows"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.1/lemonade-burn-server-0.1.1-x86_64-macos.tar.gz"
dest = "lemonade-burn-server-0.1.1-x86_64-macos.tar.gz"
sha256 = "0a922b1d275ad0ef3cc8161e46fe7a04906061cc633660973665a154396495e5"
platform = "x86_64-macos"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.1/lemonade-burn-server-0.1.1-aarch64-macos.tar.gz"
dest = "lemonade-burn-server-0.1.1-aarch64-macos.tar.gz"
sha256 = "12a9f6533eed4139f226ebe7578744a6bce28e7d52c4edcc25b819eb4ff607d7"
platform = "aarch64-macos"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.0/bitnet-b1.58-2B-4T-lbt.tar.gz"
dest = "bitnet-b1.58-2B-4T-lbt.tar.gz"
sha256 = "2e869bf83ef7d215de6377dcc2f8468083568fba70016a4ec24cc1acca39dc86"

[[engine]]
id = "icedlemcake"
name = "Iced lemon cake (extended Lemonade server)"
summary = "A Lemonade 11.9 build with two extra backends, Cake and lemonade-burn, plus llama.cpp on Vulkan. Registered as one provider."
licence = "Lemonade (Apache-2.0) with added backends (MIT OR Apache-2.0)"
hardware = "Any GPU with Vulkan, or CPU"
mode = "attach"
note = "Not packaged yet: this needs the extended Lemonade server (Lemonade with the Cake and lemonade-burn backends) already running at 127.0.0.1:13410. A one-click build of that server is in progress."
url = "http://127.0.0.1:13410"
test_model = "Phi-3-mini-4k-instruct-Q4_K_M"

[[engine]]
id = "strata"
name = "Strata"
summary = "Runs large mixture-of-experts models on one gaming GPU by streaming experts. Installed with Strata's own signed installer; Strata picks the engine for your graphics card and a model for your RAM."
licence = "MIT"
hardware = "Linux x86-64 with an NVIDIA or AMD GPU (12 GB or more), or a Mac with Apple silicon; 32 GB RAM or more; the model download is often 30 to 90 GB"
mode = "managed"
port = 13450
exe = "data/terminal/current/bin/strata"
args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines"]
plan_args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines", "--plan"]
stop_args = ["runtime", "stop", "--profile", "lemonade-engines"]
start_wait_s = 172800
note = "Before the first start the page shows what Strata will download (model, draft layer, picture reader and the engine for your card) and asks you to accept it. The download can take hours; progress is shown under the step. On Windows, use Strata's own installer for now."
# Strata's own installer from its v0.2.3.1 release (sha256 from the release's SHA256SUMS.txt). It checks the
# download's checksum and the release's signature and installs into this engine's folder.
env = { STRATA_FEED = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1", STRATA_DATA_DIR = "{dir}/data", STRATA_BIN_DIR = "{dir}/bin" }
[[engine.files]]
source = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1/install.sh"
dest = "install.sh"
sha256 = "73a3e0cbd8f2f00e1f26a304c1f8f498afdf9be3a4a9f58c83fa5ffdb6642780"
platform = "x86_64-linux"
run = ["sh", "{dir}/install.sh"]
[[engine.files]]
source = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1/install.sh"
dest = "install.sh"
sha256 = "73a3e0cbd8f2f00e1f26a304c1f8f498afdf9be3a4a9f58c83fa5ffdb6642780"
platform = "aarch64-macos"
run = ["sh", "{dir}/install.sh"]

[[engine]]
id = "cake"
name = "Cake"
summary = "Distributed, layer-sharded inference across several machines. Offloads only some operations to the GPU, so it is a distribution path, not a speed path."
licence = "FAIR License (Free Access for Individuals and Researchers): non-commercial use only"
licence_url = "https://github.com/evilsocket/cake/blob/main/LICENSE.md"
accept_licence = true
hardware = "Any; Vulkan or Metal GPU optional"
mode = "attach"
url = "http://127.0.0.1:13410"
test_model = "Qwen2.5-Coder-1.5B-Cake"
note = "Not packaged yet: this needs the extended Lemonade server (Lemonade with the Cake and lemonade-burn backends) already running at 127.0.0.1:13410. A one-click build of that server is in progress. Served through the extended Lemonade server's cake backend. Not redistributed: fetched after you accept its licence."
# Cake needs its port and launch command at load time, which a request routed through Lemonade cannot carry.
preload = { model_name = "user.Qwen2.5-Coder-1.5B-Cake", cake_port = 18492, cake_args = "HF_HUB_OFFLINE=1 /home/cesarops/cake-test/bin/cake serve {model} --api 127.0.0.1:{port} --address 127.0.0.1:{worker_port} --dtype f16 --temperature 0" }
