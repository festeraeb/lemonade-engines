[[engine]]
id = "icedlemcake"
name = "Iced lemon cake (extended Lemonade server)"
summary = "A Lemonade 2026.43.3 server with two extra backends, Cake and lemonade-burn, next to the usual llama.cpp ones. Runs on its own port and is registered with your Lemonade as one provider."
licence = "Lemonade (Apache-2.0) with added backends (MIT OR Apache-2.0)"
hardware = "Linux x86-64 (glibc 2.38 or newer, so Ubuntu 24.04 or newer) or Windows x86-64; about 60 MB, plus the 0.7 GB test model and a llama.cpp build that its Lemonade downloads on first use. Uses a Vulkan GPU when there is one, else the CPU."
mode = "managed"
port = 13410
test_model = "LFM2-1.2B-GGUF"
exe = "lemond"
args = ["--host", "127.0.0.1", "--port", "{port}", "--no-broadcast", "--log-file", "disabled", "{dir}/cache", "{dir}/config"]
note = "Setting it up downloads a small test model and the llama.cpp build it runs on; that can take a few minutes."
# Loaded on the engine first: a request routed through your Lemonade cannot carry load options, and this also fetches the test model.
preload = { model_name = "LFM2-1.2B-GGUF" }
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-engines/releases/download/v0.3.0/iced-lemcake-2026.43.3-x86_64-linux.tar.gz"
dest = "iced-lemcake-2026.43.3-x86_64-linux.tar.gz"
sha256 = "67e4b72f4de89e5254140c060ba09a7ad24efae0f9a15cb8afd2d63db43ead74"
platform = "x86_64-linux"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-engines/releases/download/v0.3.0/iced-lemcake-2026.43.3-x86_64-windows.tar.gz"
dest = "iced-lemcake-2026.43.3-x86_64-windows.tar.gz"
sha256 = "a9e5b6d6aaa88329e98ac2f67e166679caa8141778ac72122e46af6387d241a0"
platform = "x86_64-windows"

[[engine]]
id = "strata"
name = "Strata"
summary = "Runs large mixture-of-experts models on one gaming GPU by streaming experts. Installed with Strata's own signed installer; Strata picks the engine for your graphics card and a model for your RAM."
licence = "MIT"
hardware = "Linux x86-64 with an NVIDIA or AMD GPU (12 GB or more), or a Mac with Apple silicon; 32 GB RAM or more; the model download is often 30 to 90 GB"
mode = "managed"
port = 13450
exe = "data/terminal/current/bin/strata"
args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines"]
plan_args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines", "--plan"]
stop_args = ["runtime", "stop", "--profile", "lemonade-engines"]
start_wait_s = 172800
note = "Before the first start the page shows what Strata will download (model, draft layer, picture reader and the engine for your card) and asks you to accept it. The download can take hours; progress is shown under the step. On Windows, use Strata's own installer for now."
# Strata's own installer from its v0.2.3.1 release (sha256 from the release's SHA256SUMS.txt). It checks the
# download's checksum and the release's signature and installs into this engine's folder.
env = { STRATA_FEED = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1", STRATA_DATA_DIR = "{dir}/data", STRATA_BIN_DIR = "{dir}/bin" }
[[engine.files]]
source = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1/install.sh"
dest = "install.sh"
sha256 = "73a3e0cbd8f2f00e1f26a304c1f8f498afdf9be3a4a9f58c83fa5ffdb6642780"
platform = "x86_64-linux"
run = ["sh", "{dir}/install.sh"]
[[engine.files]]
source = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1/install.sh"
dest = "install.sh"
sha256 = "73a3e0cbd8f2f00e1f26a304c1f8f498afdf9be3a4a9f58c83fa5ffdb6642780"
platform = "aarch64-macos"
run = ["sh", "{dir}/install.sh"]

[[engine]]
id = "cake"
name = "Cake"
summary = "Distributed, layer-sharded inference across several machines. Offloads only some operations to the GPU, so it is a distribution path, not a speed path."
licence = "FAIR License (Free Access for Individuals and Researchers): non-commercial use only"
licence_url = "https://github.com/evilsocket/cake/blob/main/LICENSE.md"
accept_licence = true
hardware = "Any; Vulkan or Metal GPU optional"
mode = "attach"
url = "http://127.0.0.1:13410"
test_model = "Qwen2.5-Coder-1.5B-Cake"
exe = "bin/cake"
note = "Needs two things that are not bundled: the extended Lemonade server (set up the Iced lemon cake entry first, it listens on 127.0.0.1:13410) and Cake's own program. Cake has no binary releases, so build it from its source and put it at bin/cake inside this engine's folder, or on PATH, or set LE_CAKE_BIN to its full path. Its model weights (3 GB) are downloaded by Cake on the first start."
# Cake needs its port and launch command at load time, which a request routed through Lemonade cannot carry.
# {bin} is the Cake program found as described above; {model}, {port} and {worker_port} are filled in by the engine.
pull = { model_name = "user.Qwen2.5-Coder-1.5B-Cake", checkpoint = "Qwen/Qwen2.5-Coder-1.5B-Instruct", recipe = "cake" }
preload = { model_name = "user.Qwen2.5-Coder-1.5B-Cake", cake_port = 18492, cake_args = "\"{bin}\" serve {model} --api 127.0.0.1:{port} --address 127.0.0.1:{worker_port} --dtype f16 --temperature 0" }

