# Engine catalogue for lemonade-engines.
#
# Each engine runs as its own OpenAI-compatible server on 127.0.0.1 and is registered with the
# user's Lemonade as a provider (`lemonade cloud install <id> --base-url http://127.0.0.1:<port>/v1`),
# so its models appear in Lemonade as `<id>.<model>`. Lemonade itself is not modified.
#
# mode = "managed": lemonade-engines installs the files and starts the server.
# mode = "attach":  the server already runs at `url`; lemonade-engines only registers it.
#
# Placeholders in args: {port}, {dir} (this engine's install folder).
# Sources: https://... (downloaded; sha256 checked when given) or file:///... (copied; a folder is copied whole).
# A source ending in .tar.gz is unpacked into the install folder.

[[engine]]
id = "burn"
name = "lemonade-burn"
summary = "Microsoft BitNet b1.58 2B4T with a packed 2-bit ternary kernel. Runs on the CPU; no GPU needed."
licence = "MIT OR Apache-2.0 (BitNet weights: MIT)"
hardware = "Linux x86-64 (glibc 2.30 or newer), Windows x86-64 or macOS (Intel or Apple silicon); about 2 GB RAM; 0.9 GB download. Fastest on x86-64 with AVX2 or AVX-512; Apple silicon uses the plain kernel."
mode = "managed"
port = 13431
test_model = "bitnet-b1.58-2B-4T"
args = ["--host", "127.0.0.1", "--port", "{port}", "--model", "{dir}/bitnet-b1.58-2B-4T-lbt", "--model-id", "bitnet-b1.58-2B-4T"]
exe = "lemonade-burn-server"
[[engine.files]]
source = "https://github.com/festeraeb/lemonade-burn/releases/download/v0.1.1/lemonade-burn-server-0.1.1-x86_64-linux.tar.gz"
