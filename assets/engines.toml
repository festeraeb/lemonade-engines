[[engine]]
id = "ternlight"
name = "ternlight (ternary sentence embeddings)"
summary = "A 384-dimension sentence-embedding model with ternary weights, served at /v1/embeddings. Runs on the CPU, about 5 MB, nothing else to download. Lemonade then lists it as an embeddings provider."
licence = "Server: Apache-2.0. Engine and model: MIT (Wenshu Tang, github.com/soycaporal/ternlight)"
hardware = "Linux x86-64 (glibc 2.31 or newer), Windows x86-64 or macOS (Intel or Apple silicon); no GPU; a few hundred MB of RAM; a 4 MB download."
kind = "embeddings"
mode = "managed"
port = 13443
test_model = "ternlight-base"
exe = "ternlight-server"
args = ["--host", "127.0.0.1", "--port", "{port}"]
note = "This is an embeddings model, not a chat model: the test asks the engine for the vectors of three sentences and shows their size, the time, and whether the two sentences about the same thing sit closer together than the unrelated one. It then tries the same request through Lemonade and says what happened: Lemonade 2026.43.3 lists the provider but does not forward embeddings requests to cloud providers, so apps should use the address shown."
