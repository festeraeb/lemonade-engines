summary = "A 384-dimension sentence-embedding model with ternary weights, served at /v1/embeddings. Runs on the CPU, about 5 MB, nothing else to download. Lemonade then lists it as an embeddings provider."
licence = "Server: Apache-2.0. Engine and model: MIT (Wenshu Tang, github.com/soycaporal/ternlight)"
tested = "Tested 2026-10-31 (throwaway Lemonade 2026.43.3, CPU only). Linux: pass, t440 (3 sentences, 384 dimensions, 147 ms; related pair 0.701 against 0.025 for the unrelated one). Windows: pass, Windows 11 nautik9 (60 ms; release asset copied by file://, sha256 still checked). Lemonade itself refuses embeddings."
hardware = "Linux x86-64 (glibc 2.31 or newer), Windows x86-64 or macOS (Intel or Apple silicon); no GPU; a few hundred MB of RAM; a 4 MB download."
