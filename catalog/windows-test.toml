[[engine]]
id = "polystrata"
name = "PolyStrata (mainline)"
summary = "PolyStrata from simplexai-labs, the mainline project: runs mixture-of-experts models on one NVIDIA card (RTX 20 series or newer) with the hot experts in video memory and the rest in RAM. Installed by PolyStrata's own setup, which downloads its ready-made Windows engine. Comes with LiquidAI's LFM2.5-24B-A2B."
licence = "Engine: MIT (PolyStrata). Model: LFM Open License v1.0 (Liquid AI), not an open-source licence."
licence_url = "https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF/blob/main/LICENSE"
accept_licence = true
tested = "Not tested through the page yet (Windows test catalogue)."
hardware = "Windows 10/11 x64 with an NVIDIA card of 8 GB or more (RTX 20 series or newer) and a current driver; 24 GB RAM or more; about 16 GB download. Python 3.12 is installed for your user if it is missing."
mode = "managed"
port = 13471
test_model = "lfm2.5-24b-a2b"
exe = "ps-start.cmd"
args = ["{port}", "{dir}", "PolyStrata-0.1.45-poly.8"]
start_wait_s = 1800
note = "Set up runs PolyStrata 0.1.45-poly.8's own installer without questions: Python, the ready-made engine (checked against the release's SHA-256), the 13.6 GB model (sha256-checked) and the tokenizer. NAUTI_STRATA_GPU picks the card."
