[[engine]]
id = "movidius"
name = "Movidius NCS1 vision graph (movidius-rust)"
group = "Bitter Lemons"
group_note = "Bitter Lemons: vision hardware on the Lemonade stand. These engines see; they do not chat."
summary = "Runs a compiled vision network on an Intel Movidius Neural Compute Stick 1 through a pure-Rust host (no OpenVINO). Lemonade lists the graph as a model that does not generate text; real inference is POST /v1/infer on the engine. Chat answers HTTP 501 on purpose."
licence = "movidius-rust: Apache-2.0. Intel's firmware is separate, is not included, and is downloaded only after you accept it."
tested = "Tested 2026-10-31. Linux: pass on cesarops4om with a real stick (stick found, firmware downloaded with both checksums matching, server started, graph listed with generates_text: false, chat 501 by design; no inference was run through the page). On t440 (no stick): No stick found shown, expected-failure pass. Windows: not offered."
licence_url = "https://github.com/festeraeb/movidius-rust"
hardware = "Linux x86-64 and an Intel NCS1 USB stick (USB id 03e7:2150 or 03e7:f63b). Needs a compiled NCSDK v1 .graph file (see the note)."
kind = "vision"
mode = "managed"
port = 13460
exe = "movidius-rust-v0.3.0-linux-x86_64/movidius-rust"
args = ["serve", "--model", "models/model.graph", "--host", "127.0.0.1", "--port", "{port}", "--firmware", "{dir}/firmware/MvNCAPI-ma2450.mvcmd"]
requires_usb = ["03e7:2150", "03e7:f63b"]
note = "The stick must be plugged in; Set up says plainly when it is not. The program needs a compiled graph that you provide: set LE_MOVIDIUS_GRAPH to its path (a SqueezeNet v1.1 graph works; tools/ncs1-compile in the movidius-rust repository builds one). Reset rule: the stick must be reset after a graph has run and before another is loaded; the program does this itself. Do not unplug it while running."
