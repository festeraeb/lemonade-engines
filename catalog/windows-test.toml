accept_licence = true
tested = "Tested 2026-11-08 with Lemonade 2026.45.3 through the page. Linux: pass on Arch, GTX 1070 8 GB with a Xeon E5-2680 v2 (the AVX-only build), downloads from GitHub and Hugging Face: install 524 s, first test chat 28 tokens in 84.7 s cold on a busy machine (21.8 s on a second run); Stop pass. Windows: not offered yet (a Windows build is being tested)."
modified = "Pascal (sm_60/61) kernel fixes, an AVX-only CPU build, GLM 5.3 and Mistral Large 4 support, expert tiers below VRAM, an optional NautiBurn routing scraper (off unless turned on)."
hardware = "Windows 10/11 x64 (test build) or Linux x86-64 (glibc 2.39 or newer, so Ubuntu 24.04 or newer) with an NVIDIA card of 8 GB or more (GTX 10-series or newer) and a driver for CUDA 12; python3 3.10 or newer with venv; 24 GB RAM or more; 14 GB download"
mode = "managed"
port = 13470
test_model = "lfm2.5-24b-a2b"
exe = "stand/start.sh"
args = ["{port}", "{dir}", "Nauti-Strata-0ab32e8530e1d0c8d430843eadc015e467aff928"]
exe_platform = { "x86_64-windows" = "ps-start.cmd" }
start_wait_s = 1800
note = "Windows: Set up runs Nauti-Strata's own setup without questions and COMPILES the engine (setup installs Visual Studio 2022 Build Tools and the CUDA toolkit if missing, about 10 GB, 30-60 minutes), then downloads the model. Linux: the first start reads the 13.6 GB model and fills the expert cache; that can take a few minutes. NautiBurn routing scrapes are off; to turn them on, write a folder path into nautiburn-scrape-dir in this engine's folder (delete the file to turn them off). NAUTI_STRATA_GPU picks the card (default 0)."
