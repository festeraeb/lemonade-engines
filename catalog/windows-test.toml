[[engine]]
id = "strata"
name = "Strata"
summary = "Runs large mixture-of-experts models on one gaming GPU by streaming experts. Installed with Strata's own signed installer; Strata picks the engine for your graphics card and a model for your RAM."
licence = "MIT"
tested = "Tested 2026-10-28 with Lemonade 2026.43.3. Linux: installer and plan pass on t440 (84 GB model, 89.7 GB download); Download, Start and Stop not run. Windows: not offered by the catalogue; the test machine's GPU is 4 GB, Strata needs 12 GB."
hardware = "Linux x86-64 with an NVIDIA or AMD GPU (12 GB or more), or a Mac with Apple silicon; 32 GB RAM or more; the model download is often 30 to 90 GB"
mode = "managed"
port = 13450
exe = "data/terminal/current/bin/strata"
args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines"]
plan_args = ["launch", "--yes", "--no-tui", "--access", "local", "--port", "{port}", "--data-dir", "{dir}/models", "--save-preset", "lemonade-engines", "--plan"]
stop_args = ["runtime", "stop", "--profile", "lemonade-engines"]
start_wait_s = 172800
note = "Before the first start the page shows what Strata will download (model, draft layer, picture reader and the engine for your card) and asks you to accept it. The download can take hours; progress is shown under the step. On Windows, use Strata's own installer for now."
# Strata's own installer from its v0.2.3.1 release (sha256 from the release's SHA256SUMS.txt). It checks the
# download's checksum and the release's signature and installs into this engine's folder.
env = { STRATA_FEED = "https://github.com/Niko1221/Strata/releases/download/v0.2.3.1", STRATA_DATA_DIR = "{dir}/data", STRATA_BIN_DIR = "{dir}/bin" }
[[engine.files]]
