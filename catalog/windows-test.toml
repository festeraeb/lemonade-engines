mode = "managed"
port = 13443
test_model = "ternlight-base"
exe = "ternlight-server"
args = ["--host", "127.0.0.1", "--port", "{port}"]
note = "This is an embeddings model, not a chat model: the test asks the engine for the vectors of three sentences and shows their size, the time, and whether the two sentences about the same thing sit closer together than the unrelated one. It then tries the same request through Lemonade and says what happened: Lemonade 2026.43.3 lists the provider but does not forward embeddings requests to cloud providers, so apps should use the address shown."
