[package]
name = "lemonade-engines"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Add engines to a stock Lemonade server: install, start on loopback, register as a provider, test."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rand = "0.8"
